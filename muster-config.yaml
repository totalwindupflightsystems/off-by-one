# Muster MCP configuration for Off-by-One integration.
#
# Muster reads this config, fetches the OpenAPI spec from the server_url,
# and auto-generates MCP tools (submit_problem, discover_solution,
# list_problems, get_queue_status, export_to_git, import_from_git,
# get_taxonomy, get_stats, get_related, list_queue).
#
# Usage:
#   muster serve --config muster-config.yaml
#
# Or use the helper script:
#   make connect-muster

server_url: http://localhost:8766
openapi_endpoint: /openapi.json

# MCP server settings — Muster exposes these tools to AI agents.
mcp:
  transport: stdio
  name: off-by-one
  version: "0.1.0"

# Generated tool names (Muster derives these from operationId in the spec).
# Listed here for documentation purposes.
tools:
  - submit_problem    # POST /api/v1/problems/submit
  - discover_solution # POST /api/v1/problems/discover
  - list_problems     # GET  /api/v1/problems
  - get_queue_status  # GET  /api/v1/queue/{submission_id}
  - export_to_git     # POST /api/v1/export
  - import_from_git   # POST /api/v1/import
  - get_taxonomy      # GET  /api/v1/taxonomy
  - get_stats         # GET  /api/v1/stats
  - get_related       # GET  /api/v1/problems/{class}/related
  - list_queue        # GET  /api/v1/queue

# Health check interval (seconds). Muster pings /health to verify the
# Off-by-One server is up.
health_check_interval: 30
