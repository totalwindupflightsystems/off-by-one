<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Off-by-One — Pre-Solve Lab</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">◐</span>
      <span class="brand-title">Off-by-One</span>
      <span class="brand-sub">Pre-Solve Lab</span>
    </div>
    <button class="settings-btn" type="button" title="Settings" aria-label="Settings">⚙</button>
  </header>

  <nav class="app-nav" role="tablist">
    <button class="nav-tab active" data-view="search" role="tab" aria-selected="true">🔍 Search</button>
    <button class="nav-tab" data-view="submit" role="tab" aria-selected="false">📤 Submit</button>
    <button class="nav-tab" data-view="explore" role="tab" aria-selected="false">🌳 Explore</button>
    <button class="nav-tab" data-view="export" role="tab" aria-selected="false">📦 Export</button>
    <button class="nav-tab" data-view="import" role="tab" aria-selected="false">📥 Import</button>
  </nav>

  <main class="app-main">
    <section class="view active" id="view-search" role="tabpanel">
      <div class="view-loading" id="loading-search">Loading search view…</div>
    </section>
    <section class="view" id="view-submit" role="tabpanel" hidden>
      <div class="view-loading" id="loading-submit">Loading submit view…</div>
    </section>
    <section class="view" id="view-explore" role="tabpanel" hidden>
      <div class="view-loading" id="loading-explore">Loading explore view…</div>
    </section>
    <section class="view" id="view-export" role="tabpanel" hidden>
      <div class="view-loading" id="loading-export">Loading export view…</div>
    </section>
    <section class="view" id="view-import" role="tabpanel" hidden>
      <div class="view-loading" id="loading-import">Loading import view…</div>
    </section>
  </main>

  <aside class="chat-sidebar" id="chat-sidebar" aria-label="AI Agent Chat">
    <div class="chat-header">
      <span class="chat-title">💬 AI Agent</span>
      <button class="chat-toggle" id="chat-toggle" aria-label="Toggle chat">«</button>
    </div>
    <div class="chat-body" id="chat-body">
      <div class="chat-empty">Chat is offline in this build — see WI-013.</div>
    </div>
    <div class="chat-input-row">
      <input class="chat-input" id="chat-input" type="text" placeholder="Ask the agent…" disabled />
      <button class="chat-send" id="chat-send" disabled>Send</button>
    </div>
  </aside>

  <footer class="app-statusbar">
    <span class="status-pill">Queue: <span id="status-queue">—</span></span>
    <span class="status-pill">Cache: <span id="status-cache">—</span> answers</span>
    <span class="status-pill">Hit rate: <span id="status-hitrate">—</span></span>
    <span class="status-spacer"></span>
    <span class="status-version" id="status-version">v0.0.0</span>
  </footer>

  <script src="/js/app.js" defer></script>
  <script src="/js/search.js" defer></script>
  <script src="/js/submit.js" defer></script>
</body>
</html>
