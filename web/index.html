<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Off-by-One — the pre-solve lab. Verified answers to hard engineering problems, generated before you ask. Open catalog, open source." />
  <meta property="og:title" content="Off-by-One — Pre-Solve Lab" />
  <meta property="og:description" content="Verified answers to hard engineering problems, generated before you ask. Browse the open catalog, find the repo, read the docs." />
  <meta property="og:type" content="website" />
  <title>Off-by-One — Pre-Solve Lab</title>
  <script>
    // Theme boot — runs before first paint to avoid a flash. Auto-detects
    // the system preference on first visit; a manual toggle overrides.
    (function () {
      var t = localStorage.getItem('ob1-theme');
      if (!t) {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css?v=15" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">◐</span>
      <span class="brand-title">Off-by-One</span>
      <span class="brand-sub">Pre-Solve Lab</span>
    </div>
    <button class="theme-btn" id="theme-toggle" type="button" title="Toggle light/dark" aria-label="Toggle theme">🌙</button>
    <button class="settings-btn" type="button" title="Settings" aria-label="Settings">⚙</button>
  </header>

  <nav class="app-nav" role="tablist">
    <button class="nav-tab active" data-view="home" role="tab" aria-selected="true">🏠 Home</button>
    <button class="nav-tab" data-view="search" role="tab" aria-selected="false">🔍 Search</button>
    <button class="nav-tab" data-view="submit" role="tab" aria-selected="false">📤 Submit</button>
    <button class="nav-tab" data-view="explore" role="tab" aria-selected="false">🌳 Explore</button>
    <button class="nav-tab" data-view="system" role="tab" aria-selected="false">📡 System</button>
    <button class="nav-tab" data-view="export" role="tab" aria-selected="false">📦 Export</button>
    <button class="nav-tab" data-view="import" role="tab" aria-selected="false">📥 Import</button>
  </nav>

  <main class="app-main">
    <section class="view active" id="view-home" role="tabpanel">
      <div class="view-loading" id="loading-home">Loading home…</div>
    </section>
    <section class="view" id="view-search" role="tabpanel" hidden>
      <div class="view-loading" id="loading-search">Loading search view…</div>
    </section>
    <section class="view" id="view-problem" role="tabpanel" hidden></section>
    <section class="view" id="view-submit" role="tabpanel" hidden>
      <div class="view-loading" id="loading-submit">Loading submit view…</div>
    </section>
    <section class="view" id="view-explore" role="tabpanel" hidden>
      <div class="view-loading" id="loading-explore">Loading explore view…</div>
    </section>
    <section class="view" id="view-system" role="tabpanel" hidden>
      <div class="view-loading" id="loading-system">Loading system view…</div>
    </section>
    <section class="view" id="view-export" role="tabpanel" hidden>
      <div class="view-loading" id="loading-export">Loading export view…</div>
    </section>
    <section class="view" id="view-import" role="tabpanel" hidden>
      <div class="view-loading" id="loading-import">Loading import view…</div>
    </section>
  </main>

  <aside class="chat-sidebar" id="chat-sidebar" aria-label="AI Agent Chat">
    <div class="chat-header">
      <span class="chat-title">💬 AI Agent</span>
      <button class="chat-toggle" id="chat-toggle" aria-label="Toggle chat">«</button>
    </div>
    <div class="chat-body" id="chat-body">
    </div>
    <div class="chat-input-row">
      <input class="chat-input" id="chat-input" type="text" placeholder="Connecting…" disabled />
      <button class="chat-send" id="chat-send" disabled>Send</button>
    </div>
  </aside>

  <footer class="app-statusbar">
    <span class="status-pill">Queue: <span id="status-queue">—</span></span>
    <span class="status-pill">Cache: <span id="status-cache">—</span> answers</span>
    <span class="status-pill">Hit rate: <span id="status-hitrate">—</span></span>
    <span class="status-spacer"></span>
    <span class="status-version" id="status-version">v0.0.0</span>
  </footer>

  <script src="/js/home.js?v=12" defer></script>
  <script src="/js/search.js?v=2" defer></script>
  <script src="/js/problem.js?v=1" defer></script>
  <script src="/js/markdown.js" defer></script>
  <script src="/js/submit.js" defer></script>
  <script src="/js/explore.js" defer></script>
  <script src="/js/system.js?v=12" defer></script>
  <script src="/js/export.js" defer></script>
  <script src="/js/import.js" defer></script>
  <script src="/js/chat.js" defer></script>
  <!-- app.js last: it boots the shell and calls the initView_* modules, so
       every view module must already be loaded when it executes. -->
  <script src="/js/app.js?v=15" defer></script>
</body>
</html>
