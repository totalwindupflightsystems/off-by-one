# Off-by-One — gitleaks configuration
#
# The corpus (data/) and its generated public pages (site/) are PUBLIC
# BY DESIGN: they contain example/dummy credential strings from verified
# answers (e.g. "APP_KEY=0123...", "nobody:ghp_invalid"). These are not
# real secrets — they are corpus content. Both gitleaks and the GitReins
# built-in scanner honor this allowlist.

[extend]
useDefault = true

[allowlist]
description = "Public answer corpus + generated static site — example credential strings by design"
paths = [
  '''data/answers/.*''',
  '''data/answers\.jsonl''',
  '''data/INDEX\.md''',
  '''site/.*''',
  '''\.env''',
  # SQLite store files — the graph DB and its WAL embed corpus answer text
  # verbatim (the same strings the data/ allowlist already covers). A
  # workdir-wide scan (gitleaks detect --no-git, GitReins tier-1 judge)
  # re-trips on them unless the DB artifacts are allowlisted too.
  '''off-by-one\.db(-wal|-shm)?$''',
]
commits = [
  # Test-only placeholders introduced in ee997b7 (OB-GAP-015) are not real
  # credentials; the commit also holds the allowlist tests that assert the
  # server never echoes them. Allow them at the commit scope so the rest
  # of history and the working tree stay covered.
  "ee997b7012d99deaadb7a913c6268e95b079e25e",
]
