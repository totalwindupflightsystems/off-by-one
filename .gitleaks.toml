# Gitleaks config for off-by-one
# gitleaks --no-git does NOT respect .gitignore — it scans runtime artifacts
# (off-by-one.db-wal, .env) that are gitignored and never committed. Those
# files contain real-looking strings (SPDX license identifiers, API keys in
# the local .env used to RUN the server) that are NOT secrets from the repo's
# perspective. Allowlist them by path so the guard reflects commit risk only.
#
# All default gitleaks rules stay active for every tracked file.
[extend]
useDefault = true

[allowlist]
description = "Gitignored runtime artifacts + SPDX Linking Exception identifier (sk-api-key rule false positive) + answer corpus code examples"
paths = [
  # Gitignored runtime SQLite WAL/SHM (ingested problem content — contains
  # SPDX license identifiers and other real-looking strings, never committed)
  '''\.db-wal$''',
  '''\.db-shm$''',
  # Gitignored local environment file (real keys, NEVER committed — .env is
  # blocked in .gitignore; only .env.example is tracked)
  '''^\.env$''',
  # Published answer corpus (data/answers/*.json, data/answers.jsonl) —
  # solutions are real-world code examples that legitimately contain
  # credential-shaped patterns (curl -u "ci:$PAT", API-key placeholders,
  # token snippets in workflows). These are the DISTRIBUTION artifact and
  # are reviewed/verified content, not leaked secrets. Default rules still
  # apply to all source code.
  '''^data/answers/''',
  '''^data/answers\.jsonl$''',
]
regexes = [
  # SPDX Linking Exception identifier — matches gitleaks rule "sk-api-key"
  # via the "sk-" prefix. It is a license name, not a secret. Appears in
  # ingested problem content (WAL) and board text.
  '''sk-linking-protocols-exception''',
]
