# Off-by-One — gitleaks configuration
#
# The corpus (data/) and its generated public pages (site/) are PUBLIC
# BY DESIGN: they contain example/dummy credential strings from verified
# answers (e.g. "APP_KEY=0123...", "nobody:ghp_invalid"). These are not
# real secrets — they are corpus content. Both gitleaks and the GitReins
# built-in scanner honor this allowlist.

[extend]
useDefault = true

[allowlist]
description = "Public answer corpus + generated static site — example credential strings by design"
paths = [
  '''data/answers/.*''',
  '''data/answers\.jsonl''',
  '''data/INDEX\.md''',
  '''site/.*''',
  '''\.env''',
]
