openapi: 3.0.3
info:
  title: Off-by-One Pre-Solve Lab
  version: 0.1.0
  description: |
    Converting idle compute cycles into pre-verified answers for AI agents.

    Two interfaces exposed through this single API:
      - Muster MCP (AI agents) auto-generates tools from this spec.
      - Web UI (humans) calls the same endpoints with HTMX.

    Problem-class tree stored in SQLite; bubblewrap sandbox isolates Pi Agent
    solves; answers can be exported/imported as git subtrees for community
    sharing.
  contact:
    name: Off-by-One
    url: https://github.com/totalwindupflightsystems/off-by-one
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8766
    description: Local dev server

tags:
  - name: problems
    description: Problem class taxonomy and answer storage
  - name: discovery
    description: Graph traversal and full-text search
  - name: queue
    description: Submission queue status
  - name: export-import
    description: Git subtree export/import
  - name: taxonomy
    description: Full problem-class tree
  - name: stats
    description: System metrics

paths:
  /api/v1/problems/submit:
    post:
      operationId: submitProblem
      tags: [problems]
      summary: Submit problem to queue
      description: |
        Submit a problem to the pre-solve queue. Validates the submission,
        deduplicates against the existing queue and answer graph, and computes
        a priority score based on cadence and recurrence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitProblemRequest'
      responses:
        '200':
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitProblemResponse'
        '400':
          description: Invalid submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Solver unavailable — bwrap + pi-agent not configured, submissions rejected (use discover for pre-verified answers)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/problems/discover:
    post:
      operationId: discoverSolution
      tags: [discovery]
      summary: Query for pre-verified answer
      description: |
        Search the graph for a pre-verified answer to a problem class. Returns
        the best-matching answer plus related problems (graph edges) and any
        version warnings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverRequest'
      responses:
        '200':
          description: Discovery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverResponse'
        '404':
          description: No answer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/problems:
    get:
      operationId: listProblems
      tags: [problems]
      summary: Browse/search problem taxonomy
      description: |
        List problem classes with optional filters. Supports full-text search
        via the `q` parameter and pagination.
      parameters:
        - name: q
          in: query
          description: Full-text search query
          schema:
            type: string
        - name: env
          in: query
          description: Filter by environment
          schema:
            type: string
        - name: lang
          in: query
          description: Filter by language
          schema:
            type: string
        - name: status
          in: query
          description: Filter by answer status
          schema:
            type: string
            enum: [pending, verified, failed, ci_passed]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: List of problem classes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProblemsResponse'

  /api/v1/problems/{class}:
    get:
      operationId: getProblemClass
      tags: [problems]
      summary: Get problem class detail
      parameters:
        - name: class
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Problem class detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemClass'
        '404':
          description: Problem class not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/problems/{class}/answers:
    get:
      operationId: listAnswers
      tags: [problems]
      summary: List answers for problem class
      parameters:
        - name: class
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAnswersResponse'

  /api/v1/problems/{class}/answers/{id}:
    get:
      operationId: getAnswer
      tags: [problems]
      summary: Get specific answer
      parameters:
        - name: class
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Answer detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '404':
          description: Answer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/problems/{class}/related:
    get:
      operationId: getRelated
      tags: [discovery]
      summary: Get related problems (graph edges)
      parameters:
        - name: class
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Related problems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedResponse'

  /api/v1/queue:
    get:
      operationId: listQueue
      tags: [queue]
      summary: List all queued problems
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, complete, failed]
      responses:
        '200':
          description: Queue contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueListResponse'

  /api/v1/queue/{submission_id}:
    get:
      operationId: getQueueStatus
      tags: [queue]
      summary: Check submission status
      parameters:
        - name: submission_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Queue entry detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueEntry'
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/export:
    post:
      operationId: exportToGit
      tags: [export-import]
      summary: Export verified answers to git repo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: Export result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'

  /api/v1/import:
    post:
      operationId: importFromGit
      tags: [export-import]
      summary: Import answers from git repo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'

  /api/v1/taxonomy:
    get:
      operationId: getTaxonomy
      tags: [taxonomy]
      summary: Full problem-class tree
      responses:
        '200':
          description: Taxonomy tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyResponse'

  /api/v1/stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Hit rate, coverage, queue depth
      responses:
        '200':
          description: System statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'

  /openapi.json:
    get:
      operationId: getOpenAPISpec
      tags: [stats]
      summary: OpenAPI 3.0.3 specification (this document)
      responses:
        '200':
          description: OpenAPI spec
          content:
            application/json:
              schema:
                type: object

  /health:
    get:
      operationId: getHealth
      tags: [stats]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  uptime:
                    type: string

components:
  schemas:
    SubmitProblemRequest:
      type: object
      required: [problem_class, cadence]
      properties:
        problem_class:
          type: string
          description: Slugified problem identifier
        environment:
          type: string
        language:
          type: string
        version:
          type: string
        description:
          type: string
        error_message:
          type: string
        stack_trace:
          type: string
        context:
          type: object
          additionalProperties: true
        cadence:
          type: string
          enum: [pre-phase, end-of-day, post-debug]

    SubmitProblemResponse:
      type: object
      properties:
        submission_id:
          type: string
        problem_class:
          type: string
        status:
          type: string
          enum: [queued, deduplicated, rejected]
        position:
          type: integer
        estimated_time:
          type: string
        existing_solutions:
          type: integer
        related_problems:
          type: array
          items:
            type: string

    DiscoverRequest:
      type: object
      required: [problem_class]
      properties:
        problem_class:
          type: string
        environment:
          type: string
        language:
          type: string
        version:
          type: string
        include_related:
          type: boolean
          default: true

    DiscoverResponse:
      type: object
      properties:
        found:
          type: boolean
        answer:
          $ref: '#/components/schemas/Answer'
        related:
          type: array
          items:
            type: object
            properties:
              problem_class:
                type: string
              relationship:
                type: string
              relevance:
                type: number
        version_warnings:
          type: array
          items:
            type: string

    ListProblemsResponse:
      type: object
      properties:
        problems:
          type: array
          items:
            $ref: '#/components/schemas/ProblemClass'
        total:
          type: integer

    ListAnswersResponse:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
        total:
          type: integer

    ProblemClass:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        description_short:
          type: string
        answer_count:
          type: integer
        status:
          type: string
        hit_count:
          type: integer
        last_hit:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Answer:
      type: object
      properties:
        id:
          type: integer
        problem_class:
          type: string
        env:
          type: string
        lang:
          type: string
        version:
          type: string
        solution:
          type: string
        evidence:
          type: string
        signatures:
          type: object
        status:
          type: string
          enum: [pending, verified, failed, ci_passed]
        created_at:
          type: string
          format: date-time

    RelatedResponse:
      type: object
      properties:
        related:
          type: array
          items:
            type: object
            properties:
              problem_class:
                type: string
              relationship:
                type: string
              weight:
                type: number

    QueueListResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/QueueEntry'
        total:
          type: integer

    QueueEntry:
      type: object
      properties:
        submission_id:
          type: string
        problem_class:
          type: string
        status:
          type: string
          enum: [pending, in_progress, complete, failed]
        stage:
          type: string
        position:
          type: integer
        estimated_time:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    ExportRequest:
      type: object
      required: [target_repo, answer_ids]
      properties:
        target_repo:
          type: string
          description: Git URL of target repo
        answer_ids:
          type: array
          items:
            type: integer
        branch:
          type: string
        commit_message:
          type: string

    ExportResponse:
      type: object
      properties:
        commit_sha:
          type: string
        pr_url:
          type: string
        files_changed:
          type: integer

    ImportRequest:
      type: object
      required: [source_repo]
      properties:
        source_repo:
          type: string
        branch:
          type: string
        conflict_strategy:
          type: string
          enum: [skip, replace, manual]

    ImportResponse:
      type: object
      properties:
        added:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        conflicted:
          type: integer

    TaxonomyResponse:
      type: object
      properties:
        tree:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              description:
                type: string
              children:
                type: array
                items:
                  type: object

    Stats:
      type: object
      properties:
        total_problems:
          type: integer
        total_answers:
          type: integer
        verified_answers:
          type: integer
        queue_depth:
          type: integer
        hit_rate:
          type: number
        coverage:
          type: number
        avg_solve_time:
          type: string

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
