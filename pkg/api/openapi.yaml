openapi: 3.0.3
info:
  title: Off-by-One Pre-Solve Lab
  version: 0.1.0
  description: |
    Converting idle compute cycles into pre-verified answers for AI agents.

    Two interfaces exposed through this single API:
      - Muster MCP (AI agents) auto-generates tools from this spec.
      - Web UI (humans): vanilla-JavaScript single-page app calling the same
        endpoints over HTTP.

    Problem-class tree stored in SQLite; bubblewrap sandbox isolates Pi Agent
    solves; answers can be exported/imported as git subtrees for community
    sharing.
  contact:
    name: Off-by-One
    url: https://github.com/totalwindupflightsystems/off-by-one
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8766
    description: Local dev server

tags:
  - name: problems
    description: Problem class taxonomy and answer storage
  - name: discovery
    description: Graph traversal and full-text search
  - name: queue
    description: Submission queue status
  - name: export-import
    description: Git subtree export/import
  - name: taxonomy
    description: Full problem-class tree
  - name: stats
    description: System metrics

paths:
  /api/v1/problems/submit:
    post:
      operationId: submitProblem
      tags: [problems]
      summary: Submit problem to queue
      description: |
        Submit a problem to the pre-solve queue. Validates the submission,
        deduplicates against the existing queue and answer graph, and computes
        a priority score based on cadence and recurrence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitProblemRequest'
      responses:
        '200':
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitProblemResponse'
        '400':
          description: Invalid submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Solver unavailable — bwrap + pi-agent not configured, submissions rejected (use discover for pre-verified answers)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/problems/discover:
    post:
      operationId: discoverSolution
      tags: [discovery]
      summary: Query for pre-verified answer
      description: |
        Search the graph for a pre-verified answer to a problem class. Returns
        the best-matching answer plus related problems (graph edges) and any
        version warnings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverRequest'
      responses:
        '200':
          description: Discovery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverResponse'
        '404':
          description: No answer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/problems:
    get:
      operationId: listProblems
      tags: [problems]
      summary: Browse/search problem taxonomy
      description: |
        List problem classes with optional filters. Supports full-text search
        via the `q` parameter and pagination.
      parameters:
        - name: q
          in: query
          description: Full-text search query
          schema:
            type: string
        - name: env
          in: query
          description: Filter by environment
          schema:
            type: string
        - name: lang
          in: query
          description: Filter by language
          schema:
            type: string
        - name: status
          in: query
          description: Filter by answer status
          schema:
            type: string
            enum: [pending, verified, failed, ci_passed]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: List of problem classes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProblemsResponse'
        '500':
          description: Internal error listing problem classes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/problems/{class}:
    get:
      operationId: getProblemClass
      tags: [problems]
      summary: Get problem class detail
      parameters:
        - name: class
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Problem class detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemClass'
        '404':
          description: Problem class not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/problems/{class}/answers:
    get:
      operationId: listAnswers
      tags: [problems]
      summary: List answers for problem class
      parameters:
        - name: class
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAnswersResponse'

  /api/v1/problems/{class}/answers/{id}:
    get:
      operationId: getAnswer
      tags: [problems]
      summary: Get specific answer
      parameters:
        - name: class
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Answer detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '404':
          description: Answer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/problems/{class}/related:
    get:
      operationId: getRelated
      tags: [discovery]
      summary: Get related problems (graph edges)
      parameters:
        - name: class
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Related problems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedResponse'

  /api/v1/queue:
    get:
      operationId: listQueue
      tags: [queue]
      summary: List all queued problems
      description: |
        List queued submissions, newest submission first (created_at DESC).
        This is the submission view — a live submission is on the first page
        even when the queue also holds older, higher-priority imports. It is
        deliberately independent of the solver's scheduling order.

        Placeholder classes (self-test/canary/probe) are excluded. The
        exclusion is applied by SQLite, so the page comes from LIMIT/OFFSET
        and `total` from COUNT(*) over the same match set — the full
        status-filtered set is never materialised (OB-GAP-084).
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, complete, failed]
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Queue contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueListResponse'

  /api/v1/queue/{submission_id}:
    get:
      operationId: getQueueStatus
      tags: [queue]
      summary: Check submission status
      parameters:
        - name: submission_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Queue entry detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueEntry'
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/export:
    post:
      operationId: exportToGit
      tags: [export-import]
      summary: Export verified answers to git repo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: Export result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
        '400':
          description: Invalid export request — unparseable body, missing target_repo, empty answer_ids, an answer id that does not exist, or a target_repo pointing at a local non-bare working repository whose checked-out branch is the push branch (invalid_target_repo — the target must be a bare repository or a remote that accepts pushes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Export not configured — the server was started without an export directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Export failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/import:
    post:
      operationId: importFromGit
      tags: [export-import]
      summary: Import answers from git repo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400':
          description: Invalid import request — unparseable body or missing source_repo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Import conflict — import_dest_not_empty (destination already holds a non-empty answer set for this class) or source_repo_mismatch (existing shared clone points at a different origin URL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Import not configured — the server was started without an import directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Import failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/taxonomy:
    get:
      operationId: getTaxonomy
      tags: [taxonomy]
      summary: Full problem-class tree
      responses:
        '200':
          description: Taxonomy tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyResponse'

  /api/v1/stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Hit rate, coverage, queue depth
      responses:
        '200':
          description: System statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'

  /openapi.json:
    get:
      operationId: getOpenAPISpec
      tags: [stats]
      summary: OpenAPI 3.0.3 specification (this document)
      responses:
        '200':
          description: OpenAPI spec
          content:
            application/json:
              schema:
                type: object

  /health:
    get:
      operationId: getHealth
      tags: [stats]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  uptime:
                    type: string

  /metrics:
    get:
      operationId: getMetrics
      tags: [stats]
      summary: Runtime metrics snapshot
      description: |
        Per-solve and host-pressure observability counters for the cron
        solve loop. Returns 404 with error code metrics_disabled when the
        server was started without a metrics observer.
      responses:
        '200':
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsSnapshot'
        '404':
          description: Metrics observer not configured (metrics_disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    SubmitProblemRequest:
      type: object
      required: [problem_class, cadence]
      properties:
        problem_class:
          type: string
          description: Slugified problem identifier
        environment:
          type: string
        language:
          type: string
        version:
          type: string
        description:
          type: string
        error_message:
          type: string
        stack_trace:
          type: string
        context:
          type: object
          additionalProperties: true
        cadence:
          type: string
          enum: [pre-phase, end-of-day, post-debug]
        required_tools:
          type: array
          description: Tool names mounted read-only into the solve sandbox
          items:
            type: string

    SubmitProblemResponse:
      type: object
      properties:
        submission_id:
          type: string
        problem_class:
          type: string
        status:
          type: string
          enum: [queued, deduplicated, rejected]
        position:
          type: integer
        estimated_time:
          type: string
          description: |
            Best-effort estimate of how long the caller can expect to wait
            before a pre-verified answer is available for this submission.
            Derived from the lab's observed mean solve time — a rolling
            window over the 20 most recent completed solves, so it tracks
            current solver conditions rather than all-time history — and
            the number of queued jobs (capped), so it moves as solver
            throughput changes.
            It is not a guarantee: an idle lab with no completed solves yet
            falls back to a fixed per-job default, and solver availability can
            change the actual wait.
        existing_solutions:
          type: integer
        related_problems:
          type: array
          items:
            type: string
        resolved_tools:
          type: array
          items:
            type: string
          description: |
            Submit-time classification of the request's required_tools:
            the names the host CAN provision inside the solve sandbox.
            Always an array — [] when no tools were declared. A
            deduplicated submission echoes the classification recorded
            for the original queue entry.
        missing_tools:
          type: array
          items:
            type: string
          description: |
            Submit-time classification of the request's required_tools:
            the names the host CANNOT provide. The solve proceeds
            without them (degrade-gracefully, never a hard failure), so
            a non-empty array here means the answer was produced with a
            reduced tool set. Always an array — [] when nothing is
            missing. This is the API surface for what used to be a
            server-log-only WARN (DF-OFF-BY-ONE-41).

    DiscoverRequest:
      type: object
      required: [problem_class]
      properties:
        problem_class:
          type: string
        environment:
          type: string
        language:
          type: string
        version:
          type: string
        include_related:
          type: boolean
          default: true

    DiscoverResponse:
      type: object
      properties:
        found:
          type: boolean
        answer:
          $ref: '#/components/schemas/Answer'
        related:
          type: array
          items:
            type: object
            properties:
              problem_class:
                type: string
              relationship:
                type: string
              relevance:
                type: number
        version_warnings:
          type: array
          items:
            type: string

    ListProblemsResponse:
      type: object
      properties:
        problems:
          type: array
          items:
            $ref: '#/components/schemas/ProblemClass'
        total:
          type: integer

    ListAnswersResponse:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
        total:
          type: integer

    ProblemClass:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        description_short:
          type: string
        answer_count:
          type: integer
        status:
          type: string
        hit_count:
          type: integer
        last_hit:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Answer:
      type: object
      properties:
        id:
          type: integer
        problem_class:
          type: string
        env:
          type: string
        lang:
          type: string
        version:
          type: string
        solution:
          type: string
        evidence:
          type: string
        signatures:
          type: object
        status:
          type: string
          enum: [pending, verified, failed, ci_passed]
        created_at:
          type: string
          format: date-time

    RelatedResponse:
      type: object
      properties:
        related:
          type: array
          items:
            type: object
            properties:
              problem_class:
                type: string
              relationship:
                type: string
              weight:
                type: number

    QueueListResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/QueueEntry'
        total:
          type: integer
          description: |
            Number of entries the request's filter matches — the unpaginated
            match set, i.e. after the status filter and after placeholder
            (self-test/canary/probe) classes are excluded. Never the page
            size: with limit=1 over three matching rows this is 3 while
            entries has length 1. Does not move when paging with offset.

    QueueEntry:
      type: object
      properties:
        submission_id:
          type: string
        problem_class:
          type: string
        status:
          type: string
          enum: [pending, deferred, in_progress, complete, failed]
        stage:
          type: string
        position:
          type: integer
          description: |
            1-based queue position. In the list response (GET /api/v1/queue)
            it is the entry's place in the returned page, i.e. offset + index
            + 1. For a single submission (GET /api/v1/queue/{submission_id})
            it is the entry's 1-based place in the pending queue, or 0 when
            the entry is not waiting (in_progress, complete or failed).
        estimated_time:
          type: string
          description: |
            Remaining wait as a Go duration string (e.g. "2m13s"), derived
            from the lab's observed mean solve time — a rolling window over
            the 20 most recent completed solves, so stale history cannot
            underquote current conditions — multiplied by the jobs
            ahead of the entry. A pending entry waits for its place in the
            pending queue, an in_progress entry waits for one job, and the
            field is empty once the entry is complete or failed. Falls back
            to 30s per job while the lab has no completed solves to average.
            Empty while the entry is deferred: a host-pressure deferral is
            gate-bound, not queue-depth-bound, so no ETA is quoted.
        started_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp set when the entry is dequeued; empty string while the entry is pending.
        completed_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp set when the solve finishes or fails; empty string while the entry is pending.
        failure_reason:
          type: string
          description: Why a solve failed; present only when status is "failed".
        gate_reason:
          type: string
          description: Why the host-pressure gate deferred the solve (load, memory, load+memory); present only while status is "deferred" (DF-OFF-BY-ONE-45).
        resolved_tools:
          type: array
          items:
            type: string
          description: |
            Submit-time classification of the entry's required_tools:
            the names the host CAN provision inside the solve sandbox.
            Always an array — [] when no tools were declared. Persisted
            on the entry, so the value is identical for pending and
            completed entries and survives restarts (DF-OFF-BY-ONE-41).
        missing_tools:
          type: array
          items:
            type: string
          description: |
            Submit-time classification of the entry's required_tools:
            the names the host CANNOT provide. The solve proceeds
            without them (degrade-gracefully), so a non-empty array on
            a complete entry means the answer was produced with a
            reduced tool set. Always an array — [] when nothing is
            missing (DF-OFF-BY-ONE-41).

    ExportRequest:
      type: object
      required: [target_repo, answer_ids]
      properties:
        target_repo:
          type: string
          description: Git URL or local path of the target repository. Must be a bare repository (git init --bare) or a remote that accepts pushes; a local non-bare working repo whose checked-out branch is the push branch is rejected with 400 invalid_target_repo before any export work runs.
        answer_ids:
          type: array
          items:
            type: integer
        branch:
          type: string
        commit_message:
          type: string

    ExportResponse:
      type: object
      properties:
        commit_sha:
          type: string
        action:
          type: string
          enum: [exported, noop]
          description: What this export call actually did. "exported" means new content was committed and pushed to the target (commit_sha is non-empty) — this includes a re-export that recovered and pushed a previously stranded unpushed commit. "noop" means the request succeeded but the rendered answers were already identical to what the target holds, so nothing was committed or pushed (commit_sha is then empty and files_changed still counts the re-rendered files). Consumers must read action, not commit_sha emptiness, to distinguish a real export from an idempotent re-export.
        pr_url:
          type: string
          description: Reserved for future pull-request creation and never populated by the current implementation. There is no pull-request creation code path, so no export response ever carries a PR URL; the field is kept in the schema only for backward compatibility and is always omitted.
        files_changed:
          type: integer

    ImportRequest:
      type: object
      required: [source_repo]
      properties:
        source_repo:
          type: string
        branch:
          type: string
        conflict_strategy:
          type: string
          enum: [skip, replace, manual]
          default: replace

    ImportResponse:
      type: object
      properties:
        added:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        conflicted:
          type: integer
        parse_errors:
          type: integer
        details:
          type: array
          items:
            $ref: '#/components/schemas/ImportDetail'

    ImportDetail:
      type: object
      properties:
        class_title:
          type: string
        env:
          type: string
        version:
          type: string
        lang:
          type: string
        action:
          type: string
        answer_id:
          type: integer
        reason:
          type: string

    TaxonomyResponse:
      type: object
      properties:
        tree:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              description:
                type: string
              children:
                type: array
                items:
                  type: object

    Stats:
      type: object
      properties:
        total_problems:
          type: integer
        total_answers:
          type: integer
        verified_answers:
          type: integer
          description: Number of answer_nodes with status verified or ci_passed whose signatures JSON does not carry result='failed'. Failed-signature answers are excluded — status alone would over-report the cache's hit rate.
        queue_depth:
          type: integer
        hit_rate:
          type: number
          description: verified_answers / total_answers (0..1; 1.0 only when every answer is verified and no answer carries a failed signature — see verified_answers)
        coverage:
          type: number
          description: verified_answers / total_problems. Can exceed 1.0 — a problem class may hold multiple verified answers, so a value above 1 is normal, not corruption.
        avg_solve_time:
          type: string
          description: |
            Mean wall-clock solve time over the 20 most recent completed
            solves (a rolling window that tracks current solver conditions
            rather than all-time history); empty until the first solve
            completes. The queue's estimated_time fields are derived from it.

    MetricsSnapshot:
      type: object
      description: |
        Aggregate metrics view served at GET /metrics (internal/metrics
        Observer.Snapshot). Counters are process-lifetime; the last_solve,
        last_host and last_skip_reason fields are omitted until the first
        solve, gate reading or skip respectively. The bounded recent-solve
        list is served separately and is not part of this snapshot.
      properties:
        solve_count:
          type: integer
          description: Total solves recorded since process start.
        skipped_host_pressure:
          type: integer
          description: Cron/feeder runs skipped because the host was under pressure (load or memory gate tripped).
        over_budget:
          type: integer
          description: Solves whose peak RSS exceeded the alert threshold.
        rejected:
          type: integer
          description: Solves the harness refused after a clean solver exit because observed peak RSS exceeded the reject threshold (DF-OFF-BY-ONE-31).
        peak_rss_bytes_max:
          type: integer
          description: Largest peak RSS observed across solves; 0 before the first solve.
        alert_threshold_bytes:
          type: integer
          description: Live over-budget threshold in bytes.
        last_solve:
          type: object
          description: Most recent solve record; omitted when no solve has run.
          properties:
            submission_id:
              type: string
            problem_class:
              type: string
            model:
              type: string
            peak_rss_bytes:
              type: integer
            wall_time_ms:
              type: integer
            test_runs:
              type: integer
            killed:
              type: boolean
            success:
              type: boolean
            rejected:
              type: boolean
            over_budget:
              type: boolean
            alert_threshold_bytes:
              type: integer
        last_host:
          type: object
          description: Latest host-pressure gate reading (skip or healthy check); omitted before the first reading.
          properties:
            load1:
              type: number
            mem_used_fraction:
              type: number
            mem_total_bytes:
              type: integer
            mem_available_bytes:
              type: integer
            reason:
              type: string
        last_skip_reason:
          type: string
          description: Reason string of the latest skip (load, memory, load+memory); omitted when nothing ever skipped.

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
