name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25', '1.26']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (short)
        run: |
          git config --global user.email "totalwindupflightsystems@gmail.com"
          git config --global user.name "totalwindupflightsystems"
          go test -short -count=1 ./...

  # Source-level guard for the deployed-host binary contract: the built
  # ./off-by-one must honor OFF_BY_ONE_DB (OB-GAP-039). Catches regressions
  # before they reach the deployed artifact (which is gitignored and not
  # rebuilt by CI otherwise).
  binary-seed-probe:
    name: Binary seed probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-binary-seed-probe-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-binary-seed-probe-

      - name: Build binary
        run: go build -o off-by-one ./cmd/off-by-one

      - name: Probe seed honors OFF_BY_ONE_DB
        run: |
          OFF_BY_ONE_DB=/tmp/x.db ./off-by-one seed
          test -f /tmp/x.db
          echo "PASS: seed created /tmp/x.db (OFF_BY_ONE_DB contract)"
