name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Single leg on purpose: go.mod demands go 1.26.0, so with
        # GOTOOLCHAIN=auto any older leg silently downloads the 1.26
        # toolchain and both matrix legs test the identical toolchain
        # (OB-GAP-088). Keep matrix versions aligned with go.mod.
        go-version: ['1.26']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Without bwrap every sandbox test skips on its BwrapAvailable()
      # guard (internal/sandbox, internal/solver) — install it so the
      # Test (short) step actually exercises the sandbox (OB-GAP-087).
      # Explicit grouping: install must run ONLY when bwrap is absent.
      - name: Install bubblewrap (exercise sandbox tests)
        run: command -v bwrap >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap; }

      # Ubuntu 24.04 runner images ship kernel.apparmor_restrict_unprivileged_userns=1
      # (AppArmor unprivileged-userns hardening). bwrap gets far enough to create
      # its user namespace, then dies writing the uid map:
      #   "bwrap: setting up uid map: Permission denied"
      # so the OB-GAP-087 install alone flipped the sandbox tests from SKIP to
      # FAIL (OB-GAP-091). Lift the restriction so the sandbox stays exercised
      # (the point of OB-GAP-087) instead of degrading to skip-on-error.
      - name: Lift AppArmor unprivileged-userns restriction
        # Fail-open by design: a kernel without the knob has no restriction to
        # lift, and the setuid fallback step below covers that case.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "restrict knob not present on this kernel; skipping"

      # Belt-and-suspenders for future runner images: setuid-root bwrap runs its
      # privileged path and is immune to the unprivileged-userns restriction.
      - name: Ensure setuid-root bubblewrap fallback
        run: |
          BWRAP="$(command -v bwrap)"
          test -n "$BWRAP" || { echo "bwrap not found"; exit 1; }
          test "$(stat -c %a "$BWRAP")" = "4755" || { sudo chown root:root "$BWRAP" && sudo chmod 4755 "$BWRAP"; }
          echo "bwrap at $BWRAP: $(stat -c '%U:%G %a' "$BWRAP")"

      - name: Test (short)
        run: |
          git config --global user.email "totalwindupflightsystems@gmail.com"
          git config --global user.name "totalwindupflightsystems"
          go test -short -count=1 ./...

  # Regression self-test for the public-catalog publish transport. The tracked
  # publish leg (scripts/publish-catalog.sh) ships the binary + DB snapshot to
  # the catalog host over ssh/scp; a transient hop reset must retry (bounded)
  # while a non-transport failure must not, and a half-transferred pair must
  # never be activated. Shell-only change sets do not exercise the Go suite
  # meaningfully, so this job is the real gate for this area (OB-GAP-065).
  transport-retry-selftest:
    name: Transport retry self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure sqlite3 (the self-test builds a scratch DB)
        run: command -v sqlite3 >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3; }

      - name: Run transport retry self-test
        run: make transport-retry-selftest

  # Regression self-test for the deploy gate + probe (OB-GAP-085). Hermetic:
  # scratch --shared clones, a stub systemd unit on PATH and a throwaway
  # instance — it never touches a live service, and CI has none. Proves the
  # close-out gate fails RED on a stale artifact and passes GREEN after a
  # rebuild from HEAD, plus the skip/refusal matrix.
  deploy-gate-selftest:
    name: Deploy gate self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-deploy-gate-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-deploy-gate-

      # The self-test resolves stamps against this repo's history: give the
      # runner a full clone so `git describe`/`git diff <rev>` resolve.
      - name: Unshallow for stamp resolution
        run: git fetch --unshallow || true

      - name: Identity (check-binary-fresh resolves against HEAD)
        run: |
          git config --global user.email "totalwindupflightsystems@gmail.com"
          git config --global user.name "totalwindupflightsystems"

      - name: Run deploy gate self-test
        run: make check-deploy-test

  # Source-level guard for the deployed-host binary contract: the built
  # ./off-by-one must honor OFF_BY_ONE_DB (OB-GAP-039). Catches regressions
  # before they reach the deployed artifact (which is gitignored and not
  # rebuilt by CI otherwise).
  binary-seed-probe:
    name: Binary seed probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-binary-seed-probe-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-binary-seed-probe-

      - name: Build binary
        run: go build -o off-by-one ./cmd/off-by-one

      - name: Probe seed honors OFF_BY_ONE_DB
        run: |
          OFF_BY_ONE_DB=/tmp/x.db ./off-by-one seed
          test -f /tmp/x.db
          echo "PASS: seed created /tmp/x.db (OFF_BY_ONE_DB contract)"
