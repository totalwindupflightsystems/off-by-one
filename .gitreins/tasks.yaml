- id: ob1-issue1-solver-chain
  title: 'Issue #1 fresh-install solver chain: wrapper + seed + robustness + docs'
  criteria:
  - scripts/pi-agent ships a reference wrapper implementing the pi-agent solve CLI
    contract (--problem-file/--output/--evidence/--signatures/--model/--api-key),
    with PI_HOME-first install discovery, provider-qualified model mapping (openrouter
    fallback when only OPENROUTER_API_KEY is set), and closed stdin (stdio ignore)
    so pi never hangs on non-TTY stdin
  - '`off-by-one seed` loads the bundled flat corpus (data/answers/*.json) into SQLite
    idempotently (re-run creates zero duplicates) so fresh installs can discover bundled
    classes immediately'
  - extraReadOnlyPaths mounts /tmp/pi only when present; OB1_BWRAP_TIMEOUT env (seconds,
    default 300) tunes the bwrap cap with invalid values falling back to the default;
    API key selection falls back to OPENROUTER_API_KEY when DEEPSEEK_API_KEY is empty/placeholder
  - README documents the full solver chain (bwrap prerequisite, real pi link earendil-works/pi,
    wrapper install, model config, solve-time expectations, OB1_BWRAP_TIMEOUT), and
    the seed step in the quick start
  - 'Full gate battery passes: go build, go vet, gofmt clean, go test ./... -short
    (13 pkgs ok), gitreins guard 4/4'
  status: complete
  created_at: '2026-08-15T15:24:39.680257+00:00'
  completed_at: '2026-08-18T00:39:42.896177+00:00'
