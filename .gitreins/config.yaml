guards:
  secrets: true
  lint: false
  tests: false
  test_mode: full
  go:
    build: true
    lint: true
    tests: true
evaluator:
  max_iterations: 200
  max_time: 25m
  max_input_tokens: 4M
  max_output_tokens: 0.4M
  tool_call_weight: 0.1
  fast_track: auto

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: true
  storage: git
  max_verdicts: 1000
