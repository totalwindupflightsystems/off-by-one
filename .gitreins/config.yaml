guards:
  secrets: true
  lint: false
  tests: false
  test_mode: full
  # 2026-10-03: data/ corpus commits stage no Go files — the degraded-pass skip
  # made the pre-commit hook exit 1 and blocked the sync commit. Accept skips
  # on zero-work runs (they are explicit in the guard output).
  allow_skips: true
  go:
    build: true
    # lint: DISABLED 2026-10-04 (OB-GAP-086 board row). gitreins 0.15.0's
    # go_lint leg runs `golangci-lint run --new-from-rev=HEAD~1 <named files>`,
    # which (a) dies "named files must all be in one directory" when a commit
    # touches two Go packages and (b) typechecks ONLY the named files, so any
    # partial-package commit fails on symbols defined in unchanged siblings.
    # Repo-wide `golangci-lint run ./...` = 0 issues; go vet covers the gate
    # until gitreins passes package DIRS instead of files.
    lint: false
    tests: true
evaluator:
  max_iterations: 200
  max_time: 25m
  # Rung ladder (measured, OB-GAP-076 tick 389 2026-09-18): a docs-only task with a
  # 3-clause live-grep criterion burned 4,051,277 (verdict be9b8359) then 4,051,976
  # tokens_in (verdict c2f7b0de) at the 4M rung — two starved runs at the same rung,
  # so the cap is binding, not a flake (an earlier pass on the same task cost 462,188).
  # 4M -> 8M (the fleet-settled rung for live-verified criteria: 8M / 200 iter).
  # Re-judge on unchanged code and criteria; do not split the criteria.
  max_input_tokens: 8M
  max_output_tokens: 0.4M
  tool_call_weight: 0.1
  fast_track: auto

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: true
  storage: git
  max_verdicts: 1000
